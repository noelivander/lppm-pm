version: "3.8"

services:
  app:
    build: .
    container_name: lppm_app
    ports:
      - "8000:80"
    env_file:
      - .env.staging
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: lppm_db
    environment:
      MYSQL_DATABASE: lppm_pm
      MYSQL_USER: lppm
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
